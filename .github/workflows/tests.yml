name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify deterministic demo
        run: |
          mkdir -p "$DEMO_DIR"
          python -m ueba_detector demo --output-dir "$DEMO_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = json.loads((Path(os.environ["DEMO_DIR"]) / "demo_metrics.json").read_text())
          assert metrics["true_positives"] == 26
          assert metrics["false_negatives"] == 0
          assert metrics["false_positives"] == 3
          PY
        env:
          DEMO_DIR: ${{ runner.temp }}/ueba-demo

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  standards-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic standards evidence
        run: |
          python -m ueba_detector demo-combined --output-dir "$EVIDENCE" --train-samples 240 --test-samples 120 --epochs 10
          python -m ueba_detector demo --output-dir "$EVIDENCE/model" --train-samples 360 --test-samples 120 --epochs 20
          python -m ueba_detector validate-dataset --input "$EVIDENCE/combined_train_metrics.jsonl" --kind metrics --output "$EVIDENCE/metrics_validation.json"
          python -m ueba_detector validate-dataset --input "$EVIDENCE/combined_train_events.jsonl" --kind events --output "$EVIDENCE/events_validation.json"
          python -m ueba_detector audit-data --metrics "$EVIDENCE/combined_train_metrics.jsonl" --events "$EVIDENCE/combined_train_events.jsonl" --minimum-windows 100 --recommended-windows 200 --output "$EVIDENCE/readiness.json"
          python -m ueba_detector compare-models --training-input "$EVIDENCE/model/demo_train.jsonl" --input "$EVIDENCE/model/demo_test.jsonl" --epochs 20 --threshold-quantile 0.95 --output "$EVIDENCE/model_comparison.json"
          python -m ueba_detector stress-test --windows 1000 --output "$EVIDENCE/stress.json"
        env:
          EVIDENCE: ${{ runner.temp }}/ueba-standards

      - name: Enforce automated standards release gates
        run: |
          python -m ueba_detector standards-test --readiness "$EVIDENCE/readiness.json" --metrics-validation "$EVIDENCE/metrics_validation.json" --events-validation "$EVIDENCE/events_validation.json" --events "$EVIDENCE/combined_train_events.jsonl" --model-comparison "$EVIDENCE/model_comparison.json" --stress "$EVIDENCE/stress.json" --minimum-clean-windows 200 --output "$EVIDENCE/standards.json" --markdown-output "$EVIDENCE/standards.md"
          python -c 'import json, os, pathlib; report=json.loads(pathlib.Path(os.environ["EVIDENCE"] + "/standards.json").read_text()); assert report["automated_release_ready"], report'
        env:
          EVIDENCE: ${{ runner.temp }}/ueba-standards
