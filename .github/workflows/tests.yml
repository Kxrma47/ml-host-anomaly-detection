name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify deterministic demo
        run: |
          mkdir -p "$DEMO_DIR"
          python -m ueba_detector demo --output-dir "$DEMO_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = json.loads((Path(os.environ["DEMO_DIR"]) / "demo_metrics.json").read_text())
          assert metrics["true_positives"] == 26
          assert metrics["false_negatives"] == 0
          assert metrics["false_positives"] == 3
          PY
        env:
          DEMO_DIR: ${{ runner.temp }}/ueba-demo
